services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_CLASSIFY_MODEL: ${GEMINI_CLASSIFY_MODEL:-gemini-3.1-flash-lite}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-minimal}
      GEMINI_CONCURRENCY: ${GEMINI_CONCURRENCY:-5}
      APP_HOST: 0.0.0.0
      PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Caddy puts the frontend on the same origin, so no browser request is
      # ever cross-origin. Kept populated only for direct/tooling access.
      CORS_ORIGINS: ${PUBLIC_URL}
      # Waitlist signups from the upgrade modal. Blank credentials are valid:
      # the signup is still stored, just not emailed. Check which state a
      # deploy is in with GET /api/v1/waitlist/status.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WAITLIST_NOTIFY_TO: ${WAITLIST_NOTIFY_TO:-t.mutahir@gorafeeq.com}
    expose:
      - "8001"
    volumes:
      # The image bakes data/clarity.db at build time (see backend/Dockerfile),
      # but the waitlist table is written at *runtime* — without a volume every
      # rebuild silently discards captured leads. Docker seeds an empty named
      # volume from the image's /app/data on first attach, so the mock warehouse
      # still arrives intact.
      #
      # Trade-off: once the volume exists it is authoritative, so a rebuild that
      # changes the generated mock data will NOT reach an existing deploy. Run
      # `docker compose down -v` to take new mock data (this drops signups —
      # export them first, see DEPLOY.md).
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — see frontend/Dockerfile.
        # Absolute (not relative) so server-rendered fetches resolve too.
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_ALLOWED_DOMAIN: ${NEXT_PUBLIC_ALLOWED_DOMAIN}
        # This stack serves the frozen SQLite snapshot, whose data ends
        # 2026-07-28, so the UI's "today" has to be that day or every calendar
        # preset selects an empty window. The backend reaches the same
        # conclusion on its own (CLOCK_MODE=auto + a sqlite warehouse); the two
        # are flipped to live together by docker-compose.warehouse.yml.
        NEXT_PUBLIC_CLOCK_FROZEN_AT: ${NEXT_PUBLIC_CLOCK_FROZEN_AT:-2026-07-28T21:45:00}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${PUBLIC_URL}
      AUTH_TRUST_HOST: "true"
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD}
      # Leave both blank until IT provisions real OAuth; the placeholder
      # credentials provider in auth.ts handles login in the meantime.
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    expose:
      - "3000"

  caddy:
    # Config is baked in — see caddy/Dockerfile for why it isn't bind-mounted.
    build:
      context: ./caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Read at runtime by {$SITE_ADDRESS} in the Caddyfile, so switching
      # domains needs only a restart, not a rebuild.
      #
      # Falls back to :80 (plain HTTP on the bare IP). Without a default an
      # unset value makes the Caddyfile start with a bare "{", which is invalid
      # config — Caddy exits on boot and Docker restart-loops it forever.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      # Named volumes, not host paths — persists issued certificates so a
      # restart doesn't re-request them and burn Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  backend_data:
