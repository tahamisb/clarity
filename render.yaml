services:
  - type: web
    name: clarity-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # sync: false = prompt for the value in the dashboard, never store it here.
      - key: GEMINI_API_KEY
        sync: false
      # Comma-separated, no trailing slash. Left blank this becomes [""], which
      # matches no origin and silently blocks every browser request.
      - key: CORS_ORIGINS
        value: https://clarity-saas.netlify.app
      # Waitlist signup notifications. Without SMTP_PASSWORD the signups are
      # still stored, just not emailed.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: t.mutahir@gorafeeq.com
      - key: SMTP_PASSWORD
        sync: false
      - key: WAITLIST_NOTIFY_TO
        value: t.mutahir@gorafeeq.com
